test_scenarios:
  chat:
    - name: "execution_login"
      description: "Login test for user"
      enabled: true
      page: "LoginPage"
      method: "execute_successful_login_flow"
      params:
        base_url: "{{config.BASE_URL}}"
        email: "{{config.LOGIN_USER}}"
        password: "{{config.LOGIN_PASSWORD}}"
      wait_time: 5

    - name: "chat_with_doctor1"
      description: "Chat with doctor test 1"
      enabled: true
      page: "ChatPage"
      method: "send_message_to_doctor1"
      wait_time: 20

    - name: "chat_with_doctor2"
      description: "Chat with doctor test 2"
      enabled: true
      page: "ChatPage"
      method: "send_message_to_doctor2"
      wait_time: 20