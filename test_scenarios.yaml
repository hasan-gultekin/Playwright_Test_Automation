test_scenarios:
  
  # ========================================
  # REGISTRATION SCENARIOS
  # ========================================
  registration:
    - name: "successful_registration"
      description: "Başarılı kullanıcı kaydı testi"
      enabled: true
      page: "RegistrationPage"
      method: "execute_successful_registration_flow"
      params:
        base_url: "https://kamilesor.com"
      wait_time: 5

    - name: "registration_with_custom_data"
      description: "Özel verilerle kullanıcı kaydı testi"
      enabled: true
      page: "RegistrationPage"
      method: "execute_registration_flow_with_data"
      params:
        first_name: "John"
        last_name: "Doe"
        email: "user_{{timestamp}}@test.com"
        password: "Test@1234"
        base_url: "https://kamilesor.com"
      wait_time: 5

  # ========================================
  # LOGIN SCENARIOS
  # ========================================
  login:
    - name: "successful_login"
      description: "Başarılı kullanıcı girişi testi"
      enabled: true
      page: "LoginPage"
      method: "execute_successful_login_flow"
      params:
        email: "test@kamilesor.com"
        password: "Test@1234"
        base_url: "https://kamilesor.com"
      wait_time: 5

    - name: "login_with_config_credentials"
      description: "Config verilerle giriş testi"
      enabled: true
      page: "LoginPage"
      method: "execute_login_flow"
      params:
        email: "{{config.LOGIN_USER}}"
        password: "{{config.LOGIN_PASSWORD}}"
        base_url: "https://kamilesor.com"
        wait_time: 5
      wait_time: 5

    - name: "login_with_dynamic_email"
      description: "Dinamik email ile giriş testi"
      enabled: false
      page: "LoginPage"
      method: "execute_login_flow"
      params:
        email: "user_{{timestamp}}@test.com"
        password: "Test@1234"
        base_url: "https://kamilesor.com"
        wait_time: 5
      wait_time: 5

  # ========================================
  # CHAT SCENARIOS
  # ========================================
  chat:
    - name: "chat_with_doctor"
      description: "Doktorla mesaj gönderme testi"
      enabled: true
      page: "ChatPage"
      method: "execute_chat_with_doctor"
      params:
        base_url: "https://kamilesor.com"
        message: MESSAGE_TO_DOCTOR1
      wait_time: 3

    - name: "chat_with_it_specialist"
      description: "IT Uzmanıyla mesaj gönderme testi"
      enabled: true
      page: "ChatPage"
      method: "execute_chat_with_it"
      params:
        base_url: "https://kamilesor.com"
        message: MESSAGE_TO_IT1
      wait_time: 3

